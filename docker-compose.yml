name: garden

services:
  garden:
    build:
      context: ../garden
      dockerfile: Dockerfile
      additional_contexts:
        infra: .
    ports:
      - "8080:80"
    restart: unless-stopped

  garden-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../garden:/app
      - garden_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  garden_node_modules:
